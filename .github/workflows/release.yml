name: Release

# Desktop installers for Windows, Linux and macOS.
#
# - push of a vX.Y.Z tag: quality + security gates, version check, build every
#   platform in the protected `release` environment (signing when its secrets
#   exist), then a DRAFT GitHub Release with checksums, SBOM and attestations.
#   A human reviews and publishes the draft.
# - pull_request touching the desktop build: build-only check on all 3 OSes,
#   never signs, never releases.
# - workflow_dispatch: build-only dry run (workflow artifacts, no release).
#   `sign: true` also exercises signing through the `release` environment.
#
# Every platform is signed when its secrets are configured and built UNSIGNED
# otherwise; the job summary and the release notes say which. Set the
# repository variable REQUIRE_SIGNING=true to make a tag build fail instead.
# Secrets and setup: docs/ci-security.md#releases.

on:
  push:
    tags: ["v*.*.*"]
  pull_request:
    paths:
      - .github/workflows/release.yml
      - .github/actions/setup-safe-chain/**
      - src-tauri/**
      - scripts/build-sidecar.mjs
      - scripts/smoke-desktop.ps1
      - scripts/smoke-sidecar.mjs
      - scripts/check-webview.mjs
      - backend/requirements-build.txt
      - backend/sidecar_entry.py
      - package.json
      - package-lock.json
  workflow_dispatch:
    inputs:
      sign:
        description: "Sign with the secrets of the protected `release` environment (needs approval). Dispatch never creates a release."
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHON_VERSION: "3.12"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  # Tag builds and opted-in dispatches may sign; pull requests never do.
  ALLOW_SIGNING: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.sign) }}

jobs:
  quality:
    name: Quality
    if: github.event_name == 'push'
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  security:
    name: Security scan
    if: github.event_name == 'push'
    uses: ./.github/workflows/security.yml
    permissions:
      contents: read
      security-events: write
      issues: write

  validate-version:
    name: Version consistency
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require every manifest to match the tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import json, os, re, sys
          from pathlib import Path
          if not re.fullmatch(r"v\d+\.\d+\.\d+", os.environ["TAG"]):
              print(f"Release tag must be strict SemVer vX.Y.Z: {os.environ['TAG']}", file=sys.stderr)
              sys.exit(1)
          expected = os.environ["TAG"].removeprefix("v")
          versions = {
              "package.json": json.loads(Path("package.json").read_text())["version"],
              "frontend/package.json": json.loads(Path("frontend/package.json").read_text())["version"],
              "website/package.json": json.loads(Path("website/package.json").read_text())["version"],
              "src-tauri/tauri.conf.json": json.loads(Path("src-tauri/tauri.conf.json").read_text())["version"],
          }
          cargo = Path("src-tauri/Cargo.toml").read_text()
          versions["src-tauri/Cargo.toml"] = re.search(r'^version\s*=\s*"([^"]+)"', cargo, re.M).group(1)
          wrong = {path: value for path, value in versions.items() if value != expected}
          if wrong:
              print(f"Tag {expected} does not match: {wrong}", file=sys.stderr)
              sys.exit(1)
          print(versions)
          PY

  # Windows is its own job: Azure Trusted Signing needs an OIDC token
  # (id-token: write), which the Linux/macOS builds must not receive.
  build-windows:
    name: Build windows-x64
    needs: [quality, security, validate-version]
    # Gates are skipped on pull_request/dispatch; on a tag they must pass.
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}
    runs-on: windows-2025
    timeout-minutes: 90
    environment: ${{ (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.sign)) && 'release' || '' }}
    permissions:
      contents: read
      id-token: write # azure/login OIDC for Trusted Signing; unused when unsigned
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # No dependency caches in a release workflow (cache poisoning).
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: ./.github/actions/setup-safe-chain
      - run: npm ci --ignore-scripts
      - run: npm ci --ignore-scripts --prefix frontend

      - name: Decide signing
        id: signing
        env:
          HAS_AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID != '' }}
          HAS_AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID != '' }}
          HAS_AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID != '' }}
          HAS_AZURE_TRUSTED_SIGNING_ENDPOINT: ${{ vars.AZURE_TRUSTED_SIGNING_ENDPOINT != '' }}
          HAS_AZURE_TRUSTED_SIGNING_ACCOUNT: ${{ vars.AZURE_TRUSTED_SIGNING_ACCOUNT != '' }}
          HAS_AZURE_TRUSTED_SIGNING_PROFILE: ${{ vars.AZURE_TRUSTED_SIGNING_PROFILE != '' }}
          REQUIRE_SIGNING: ${{ github.event_name == 'push' && vars.REQUIRE_SIGNING == 'true' }}
        run: |
          $names = 'AZURE_CLIENT_ID','AZURE_TENANT_ID','AZURE_SUBSCRIPTION_ID','AZURE_TRUSTED_SIGNING_ENDPOINT','AZURE_TRUSTED_SIGNING_ACCOUNT','AZURE_TRUSTED_SIGNING_PROFILE'
          $present = @($names | Where-Object { [Environment]::GetEnvironmentVariable("HAS_$_") -eq 'true' })
          $enabled = $false
          if ($env:ALLOW_SIGNING -eq 'true') {
            if ($present.Count -eq $names.Count) { $enabled = $true }
            elseif ($present.Count -gt 0) {
              $missing = $names | Where-Object { $present -notcontains $_ }
              throw "Partial Windows signing configuration in environment 'release'. Missing: $($missing -join ', ')"
            }
          }
          if (-not $enabled -and $env:REQUIRE_SIGNING -eq 'true') {
            throw "REQUIRE_SIGNING=true but Azure Trusted Signing is not configured in environment 'release'."
          }
          "enabled=$($enabled.ToString().ToLower())" >> $env:GITHUB_OUTPUT
          Write-Host "Windows signing enabled: $enabled"

      # PyInstaller cannot cross-compile: the sidecar is built on this runner
      # for x86_64-pc-windows-msvc before tauri-build looks for externalBin.
      - name: Build sidecar
        run: node scripts/build-sidecar.mjs
      - name: Smoke packaged sidecar
        run: node scripts/smoke-sidecar.mjs src-tauri/binaries/openharness-sidecar-x86_64-pc-windows-msvc.exe

      # Sign inside-out: sidecar, app exe, then the installers that embed them.
      # Each signing step logs in again because OIDC assertions are short-lived.
      - name: Azure login (sidecar)
        if: steps.signing.outputs.enabled == 'true'
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Sign sidecar
        if: steps.signing.outputs.enabled == 'true'
        uses: Azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          endpoint: ${{ vars.AZURE_TRUSTED_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.AZURE_TRUSTED_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.AZURE_TRUSTED_SIGNING_PROFILE }}
          files: ${{ github.workspace }}\src-tauri\binaries\openharness-sidecar-x86_64-pc-windows-msvc.exe
          file-digest: SHA256
          timestamp-digest: SHA256
          cache-dependencies: false

      - name: Build app
        run: npm exec -- tauri build --no-bundle --ci

      - name: Azure login (app)
        if: steps.signing.outputs.enabled == 'true'
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Sign app executable
        if: steps.signing.outputs.enabled == 'true'
        uses: Azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          endpoint: ${{ vars.AZURE_TRUSTED_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.AZURE_TRUSTED_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.AZURE_TRUSTED_SIGNING_PROFILE }}
          files: |
            ${{ github.workspace }}\src-tauri\target\release\openharness.exe
            ${{ github.workspace }}\src-tauri\target\release\openharness-sidecar.exe
          file-digest: SHA256
          timestamp-digest: SHA256
          cache-dependencies: false

      - name: Smoke desktop app (sidecar health, WebView, clean exit)
        run: npm run desktop:smoke

      - name: Bundle NSIS and MSI
        run: npm exec -- tauri bundle --bundles nsis,msi --ci
      - name: Locate installers
        id: bundles
        run: |
          $nsis = @(Get-ChildItem src-tauri\target\release\bundle\nsis\*-setup.exe)
          $msi = @(Get-ChildItem src-tauri\target\release\bundle\msi\*.msi)
          if ($nsis.Count -ne 1 -or $msi.Count -ne 1) { throw "Expected exactly one NSIS and one MSI installer, got $($nsis.Count) and $($msi.Count)" }
          "nsis=$($nsis[0].FullName)" >> $env:GITHUB_OUTPUT
          "msi=$($msi[0].FullName)" >> $env:GITHUB_OUTPUT

      - name: Azure login (installers)
        if: steps.signing.outputs.enabled == 'true'
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Sign installers
        if: steps.signing.outputs.enabled == 'true'
        uses: Azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          endpoint: ${{ vars.AZURE_TRUSTED_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.AZURE_TRUSTED_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.AZURE_TRUSTED_SIGNING_PROFILE }}
          files: |
            ${{ steps.bundles.outputs.nsis }}
            ${{ steps.bundles.outputs.msi }}
          file-digest: SHA256
          timestamp-digest: SHA256
          cache-dependencies: false
      - name: Verify Authenticode signatures
        if: steps.signing.outputs.enabled == 'true'
        env:
          NSIS: ${{ steps.bundles.outputs.nsis }}
          MSI: ${{ steps.bundles.outputs.msi }}
        run: |
          $files = @(
            'src-tauri\binaries\openharness-sidecar-x86_64-pc-windows-msvc.exe',
            'src-tauri\target\release\openharness.exe',
            $env:NSIS,
            $env:MSI
          )
          foreach ($f in $files) {
            $sig = Get-AuthenticodeSignature -FilePath $f
            if ($sig.Status -ne 'Valid') { throw "Authenticode verification failed for ${f}: $($sig.Status) $($sig.StatusMessage)" }
            Write-Host "Signed OK: $f ($($sig.SignerCertificate.Subject))"
          }

      - name: Stage assets with stable names
        env:
          NSIS: ${{ steps.bundles.outputs.nsis }}
          MSI: ${{ steps.bundles.outputs.msi }}
          SIGNED: ${{ steps.signing.outputs.enabled }}
        run: |
          New-Item -ItemType Directory -Force dist-release, dist-status | Out-Null
          Copy-Item -LiteralPath $env:NSIS dist-release\OpenHarness-windows-x64-setup.exe
          Copy-Item -LiteralPath $env:MSI dist-release\OpenHarness-windows-x64.msi
          if ($env:SIGNED -eq 'true') {
            $line = '- **Windows x64** (`OpenHarness-windows-x64-setup.exe`, `OpenHarness-windows-x64.msi`): **signed** with Authenticode (Azure Trusted Signing): app, sidecar and installers.'
          } else {
            $line = '- **Windows x64** (`OpenHarness-windows-x64-setup.exe`, `OpenHarness-windows-x64.msi`): **UNSIGNED**. Microsoft Defender SmartScreen shows "Windows protected your PC" / "Unknown publisher"; choose *More info* then *Run anyway*. Verify the file with `SHA256SUMS` and `gh attestation verify` first.'
          }
          Set-Content -Path dist-status\windows-x64.md -Value $line -Encoding utf8
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "### Signing status`n`n$line"
          Get-ChildItem dist-release | Format-Table Name, Length
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: installer-windows-x64
          path: dist-release/*
          if-no-files-found: error
          retention-days: ${{ github.event_name == 'push' && 30 || 7 }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: signing-status-windows-x64
          path: dist-status/*
          if-no-files-found: error
          retention-days: ${{ github.event_name == 'push' && 30 || 7 }}

  build-unix:
    name: Build ${{ matrix.id }}
    needs: [quality, security, validate-version]
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    environment: ${{ (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.sign)) && 'release' || '' }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # Oldest supported Ubuntu runner: the AppImage/.deb then run on any
          # distro with glibc >= 2.35 (Ubuntu 22.04+, Debian 12+, Fedora 36+).
          - id: linux-x64
            runner: ubuntu-22.04
            os: linux
            triple: x86_64-unknown-linux-gnu
            bundles: appimage,deb
          # Two native macOS builds instead of a universal binary: PyInstaller
          # cannot produce a universal2 sidecar unless Python and every native
          # wheel (pydantic-core, ...) are universal2, and a --onefile binary
          # cannot be lipo-merged. tauri's universal-apple-darwin target would
          # also require the sidecar for both triples on one runner.
          - id: macos-arm64
            runner: macos-15
            os: macos
            triple: aarch64-apple-darwin
            bundles: dmg
          - id: macos-x64
            runner: macos-15-intel
            os: macos
            triple: x86_64-apple-darwin
            bundles: dmg
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Tauri Linux prerequisites
        if: matrix.os == 'linux'
        # https://v2.tauri.app/start/prerequisites/#linux (+ libfuse2 for linuxdeploy's AppImage)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev \
            libssl-dev libayatana-appindicator3-dev librsvg2-dev libfuse2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: ./.github/actions/setup-safe-chain
      - run: npm ci --ignore-scripts
      - run: npm ci --ignore-scripts --prefix frontend

      - name: Decide signing
        id: signing
        env:
          OS: ${{ matrix.os }}
          REQUIRE_SIGNING: ${{ github.event_name == 'push' && vars.REQUIRE_SIGNING == 'true' }}
          HAS_APPIMAGE_GPG_PRIVATE_KEY: ${{ secrets.APPIMAGE_GPG_PRIVATE_KEY != '' }}
          HAS_APPIMAGE_GPG_KEY_ID: ${{ secrets.APPIMAGE_GPG_KEY_ID != '' }}
          HAS_APPIMAGETOOL_SIGN_PASSPHRASE: ${{ secrets.APPIMAGETOOL_SIGN_PASSPHRASE != '' }}
          HAS_APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE != '' }}
          HAS_APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD != '' }}
          HAS_APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY != '' }}
          HAS_APPLE_ID: ${{ secrets.APPLE_ID != '' }}
          HAS_APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD != '' }}
          HAS_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID != '' }}
          HAS_APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER != '' }}
          HAS_APPLE_API_KEY: ${{ secrets.APPLE_API_KEY != '' }}
          HAS_APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 != '' }}
        run: |
          set -euo pipefail
          has() { local v="HAS_$1"; [ "${!v}" = "true" ]; }
          all() { for n in "$@"; do has "$n" || return 1; done; }
          any() { for n in "$@"; do has "$n" && return 0; done; return 1; }
          if [ "$OS" = linux ]; then
            group=(APPIMAGE_GPG_PRIVATE_KEY APPIMAGE_GPG_KEY_ID APPIMAGETOOL_SIGN_PASSPHRASE)
            complete=false; all "${group[@]}" && complete=true
          else
            group=(APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY
                   APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID APPLE_API_ISSUER APPLE_API_KEY APPLE_API_KEY_P8)
            # Developer ID signing is useless to Gatekeeper without notarization:
            # require the certificate AND one notarization credential set.
            complete=false
            if all APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY \
              && { all APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID || all APPLE_API_ISSUER APPLE_API_KEY APPLE_API_KEY_P8; }; then
              complete=true
            fi
          fi
          enabled=false
          if [ "$ALLOW_SIGNING" = true ]; then
            if [ "$complete" = true ]; then
              enabled=true
            elif any "${group[@]}"; then
              echo "::error::Partial ${OS} signing configuration in environment 'release'. See docs/ci-security.md#releases."
              exit 1
            fi
          fi
          if [ "$enabled" != true ] && [ "$REQUIRE_SIGNING" = true ]; then
            echo "::error::REQUIRE_SIGNING=true but ${OS} signing is not configured in environment 'release'."
            exit 1
          fi
          echo "enabled=${enabled}" >> "$GITHUB_OUTPUT"
          echo "${OS} signing enabled: ${enabled}"

      # PyInstaller cannot cross-compile: build the sidecar natively for this triple.
      - name: Build sidecar
        run: node scripts/build-sidecar.mjs
      - name: Check sidecar target triple
        env:
          TRIPLE: ${{ matrix.triple }}
        run: |
          set -euo pipefail
          bin="src-tauri/binaries/openharness-sidecar-${TRIPLE}"
          test -x "$bin"
          file "$bin"
      - name: Smoke packaged sidecar
        env:
          TRIPLE: ${{ matrix.triple }}
        run: node scripts/smoke-sidecar.mjs "src-tauri/binaries/openharness-sidecar-${TRIPLE}"

      - name: Build and bundle
        env:
          OS: ${{ matrix.os }}
          BUNDLES: ${{ matrix.bundles }}
          SIGN_ENABLED: ${{ steps.signing.outputs.enabled }}
          # Secrets are only materialised when signing is enabled for this run.
          APPIMAGE_GPG_PRIVATE_KEY: ${{ steps.signing.outputs.enabled == 'true' && secrets.APPIMAGE_GPG_PRIVATE_KEY || '' }}
          APPIMAGE_GPG_KEY_ID: ${{ steps.signing.outputs.enabled == 'true' && secrets.APPIMAGE_GPG_KEY_ID || '' }}
          APPIMAGETOOL_SIGN_PASSPHRASE: ${{ steps.signing.outputs.enabled == 'true' && secrets.APPIMAGETOOL_SIGN_PASSPHRASE || '' }}
          APPLE_CERTIFICATE: ${{ steps.signing.outputs.enabled == 'true' && secrets.APPLE_CERTIFICATE || '' }}
          APPLE_CERTIFICATE_PASSWORD: ${{ steps.signing.outputs.enabled == 'true' && secrets.APPLE_CERTIFICATE_PASSWORD || '' }}
          APPLE_SIGNING_IDENTITY: ${{ steps.signing.outputs.enabled == 'true' && secrets.APPLE_SIGNING_IDENTITY || '' }}
          APPLE_ID: ${{ steps.signing.outputs.enabled == 'true' && secrets.APPLE_ID || '' }}
          APPLE_PASSWORD: ${{ steps.signing.outputs.enabled == 'true' && secrets.APPLE_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ steps.signing.outputs.enabled == 'true' && secrets.APPLE_TEAM_ID || '' }}
          APPLE_API_ISSUER: ${{ steps.signing.outputs.enabled == 'true' && secrets.APPLE_API_ISSUER || '' }}
          APPLE_API_KEY: ${{ steps.signing.outputs.enabled == 'true' && secrets.APPLE_API_KEY || '' }}
          APPLE_API_KEY_P8: ${{ steps.signing.outputs.enabled == 'true' && secrets.APPLE_API_KEY_P8 || '' }}
        run: |
          set -euo pipefail
          # Tauri treats a set-but-empty APPLE_* variable as configured: drop empties.
          for v in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY \
                   APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID APPLE_API_ISSUER APPLE_API_KEY APPLE_API_KEY_P8; do
            [ -n "${!v}" ] || unset "$v"
          done
          config=()
          if [ "$OS" = macos ]; then
            if [ "$SIGN_ENABLED" = true ]; then
              if [ -n "${APPLE_API_KEY_P8:-}" ]; then
                export APPLE_API_KEY_PATH="${RUNNER_TEMP}/AuthKey.p8"
                printf '%s' "$APPLE_API_KEY_P8" > "$APPLE_API_KEY_PATH"
                unset APPLE_API_KEY_P8
              fi
            else
              # Ad-hoc signature: Apple Silicon refuses to run unsigned code and
              # would report the app as "damaged". This is NOT a Developer ID.
              config=(--config '{"bundle":{"macOS":{"signingIdentity":"-"}}}')
            fi
          elif [ "$OS" = linux ] && [ "$SIGN_ENABLED" = true ]; then
            # Tauri AppImage signing: https://v2.tauri.app/distribute/sign/linux/
            printf '%s' "$APPIMAGE_GPG_PRIVATE_KEY" | gpg --batch --import
            export SIGN=1 SIGN_KEY="$APPIMAGE_GPG_KEY_ID" APPIMAGETOOL_FORCE_SIGN=1
          fi
          unset APPIMAGE_GPG_PRIVATE_KEY
          npm exec -- tauri build --bundles "$BUNDLES" --ci ${config[@]+"${config[@]}"}
          rm -f "${RUNNER_TEMP}/AuthKey.p8"

      - name: Stage assets with stable names
        env:
          ID: ${{ matrix.id }}
          OS: ${{ matrix.os }}
          SIGNED: ${{ steps.signing.outputs.enabled }}
        run: |
          set -euo pipefail
          bundle=src-tauri/target/release/bundle
          # one DIR PATTERN: print the single bundle output matching PATTERN, else fail.
          one() {
            local found
            found=$(find "$1" -mindepth 1 -maxdepth 1 -name "$2")
            if [ -z "$found" ] || [ "$(printf '%s\n' "$found" | wc -l)" -ne 1 ]; then
              echo "::error::expected exactly one $1/$2, got: ${found:-none}" >&2
              exit 1
            fi
            printf '%s\n' "$found"
          }
          mkdir -p dist-release dist-status
          case "$ID" in
            linux-x64)
              cp "$(one "$bundle/appimage" "*.AppImage")" dist-release/OpenHarness-linux-x86_64.AppImage
              cp "$(one "$bundle/deb" "*.deb")" dist-release/OpenHarness-linux-amd64.deb
              dpkg-deb --info dist-release/OpenHarness-linux-amd64.deb | sed -n '1,20p'
              dpkg-deb --contents dist-release/OpenHarness-linux-amd64.deb | grep -q 'openharness-sidecar' \
                || { echo "::error::.deb does not contain the sidecar"; exit 1; }
              if [ "$SIGNED" = true ]; then
                sig=$(APPIMAGE_EXTRACT_AND_RUN=1 dist-release/OpenHarness-linux-x86_64.AppImage --appimage-signature || true)
                printf '%s' "$sig" | grep -q 'BEGIN PGP SIGNATURE' \
                  || { echo "::error::AppImage has no embedded GPG signature"; exit 1; }
                line="- **Linux x86_64** (\`OpenHarness-linux-x86_64.AppImage\`, \`OpenHarness-linux-amd64.deb\`): AppImage **signed** with an embedded GPG signature; the .deb is verified through \`SHA256SUMS\` and the attestation."
              else
                line="- **Linux x86_64** (\`OpenHarness-linux-x86_64.AppImage\`, \`OpenHarness-linux-amd64.deb\`): **UNSIGNED** (no embedded AppImage GPG signature). Linux shows no warning; verify the file with \`SHA256SUMS\` and \`gh attestation verify\`."
              fi
              ;;
            macos-arm64|macos-x64)
              arch=${ID#macos-}
              app=$(one "$bundle/macos" "*.app")
              grep -q . <(find "$app/Contents/MacOS" -name 'openharness-sidecar*') \
                || { echo "::error::.app does not contain the sidecar"; exit 1; }
              codesign --verify --deep --strict --verbose=2 "$app"
              cp "$(one "$bundle/dmg" "*.dmg")" "dist-release/OpenHarness-macos-${arch}.dmg"
              label=$([ "$arch" = arm64 ] && echo "Apple silicon" || echo "Intel")
              if [ "$SIGNED" = true ]; then
                spctl --assess --type execute --verbose=4 "$app"
                xcrun stapler validate "$app"
                line="- **macOS ${label}** (\`OpenHarness-macos-${arch}.dmg\`): **signed** with Developer ID and **notarized** by Apple."
              else
                line="- **macOS ${label}** (\`OpenHarness-macos-${arch}.dmg\`): **UNSIGNED** (ad-hoc signature only, not notarized). Gatekeeper blocks the first launch (\"Apple could not verify OpenHarness is free of malware\"); open *System Settings > Privacy & Security* and choose *Open Anyway*, or run \`xattr -dr com.apple.quarantine /Applications/OpenHarness.app\` after verifying the file."
              fi
              ;;
            *) echo "::error::unknown matrix id $ID"; exit 1 ;;
          esac
          printf '%s\n' "$line" > "dist-status/${ID}.md"
          printf '### Signing status\n\n%s\n' "$line" >> "$GITHUB_STEP_SUMMARY"
          ls -la dist-release
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: installer-${{ matrix.id }}
          path: dist-release/*
          if-no-files-found: error
          retention-days: ${{ github.event_name == 'push' && 30 || 7 }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: signing-status-${{ matrix.id }}
          path: dist-status/*
          if-no-files-found: error
          retention-days: ${{ github.event_name == 'push' && 30 || 7 }}

  attest-and-release:
    name: Attest and draft release
    needs: [build-windows, build-unix]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write # create the draft release
      id-token: write # attestations (Sigstore)
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: source
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: installer-*
          merge-multiple: true
          path: release-assets
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: signing-status-*
          merge-multiple: true
          path: signing-status
      - name: Require the complete asset set
        run: |
          set -euo pipefail
          expected=(
            OpenHarness-windows-x64-setup.exe
            OpenHarness-windows-x64.msi
            OpenHarness-linux-x86_64.AppImage
            OpenHarness-linux-amd64.deb
            OpenHarness-macos-arm64.dmg
            OpenHarness-macos-x64.dmg
          )
          for f in "${expected[@]}"; do test -s "release-assets/$f" || { echo "::error::missing $f"; exit 1; }; done
          test "$(find release-assets -maxdepth 1 -type f | wc -l)" -eq "${#expected[@]}"
      # SBOM of what the installers are built from: npm, Cargo and Python lockfiles.
      - uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          path: source
          format: cyclonedx-json
          output-file: release-assets/OpenHarness-sbom.cdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Create SHA256SUMS
        working-directory: release-assets
        run: |
          set -euo pipefail
          sha256sum OpenHarness-* > SHA256SUMS
          cat SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            release-assets/OpenHarness-*
            release-assets/SHA256SUMS
      - uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: |
            release-assets/OpenHarness-windows-*
            release-assets/OpenHarness-linux-*
            release-assets/OpenHarness-macos-*
          sbom-path: release-assets/OpenHarness-sbom.cdx.json
      - name: Write release notes
        env:
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          {
            echo "## Downloads"
            echo
            echo "| Platform | File |"
            echo "| --- | --- |"
            echo "| Windows 10/11 x64 | \`OpenHarness-windows-x64-setup.exe\` (per-user installer) or \`OpenHarness-windows-x64.msi\` |"
            echo "| macOS Apple silicon | \`OpenHarness-macos-arm64.dmg\` |"
            echo "| macOS Intel | \`OpenHarness-macos-x64.dmg\` |"
            echo "| Linux x86_64 | \`OpenHarness-linux-x86_64.AppImage\` or \`OpenHarness-linux-amd64.deb\` (Ubuntu 22.04+ / Debian 12+) |"
            echo
            echo "## Code signing"
            echo
            cat signing-status/windows-x64.md signing-status/macos-arm64.md signing-status/macos-x64.md signing-status/linux-x64.md
            echo
            echo "## Verify a download"
            echo
            echo '```bash'
            echo "sha256sum --check --ignore-missing SHA256SUMS"
            echo "gh attestation verify OpenHarness-linux-x86_64.AppImage --repo ${REPO}"
            echo '```'
            echo
            echo "\`OpenHarness-sbom.cdx.json\` is the CycloneDX SBOM; every installer carries a build-provenance and an SBOM attestation."
            echo
          } > release-notes.md
          cat release-notes.md >> "$GITHUB_STEP_SUMMARY"
      - name: Create DRAFT GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "${GITHUB_REF_NAME}" release-assets/* \
            --draft --verify-tag --generate-notes --notes-file release-notes.md \
            --title "OpenHarness ${GITHUB_REF_NAME}"
          echo "Draft release created for ${GITHUB_REF_NAME}. A maintainer must review and publish it." >> "$GITHUB_STEP_SUMMARY"
