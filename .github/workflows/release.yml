name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  quality:
    name: Quality
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  security:
    name: Security scan
    uses: ./.github/workflows/security.yml
    permissions:
      contents: read
      security-events: write
      issues: write

  validate-version:
    name: Version consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Require every manifest to match the tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import json, os, re, sys
          from pathlib import Path
          if not re.fullmatch(r"v\d+\.\d+\.\d+", os.environ["TAG"]):
              print(f"Release tag must be strict SemVer vX.Y.Z: {os.environ['TAG']}", file=sys.stderr)
              sys.exit(1)
          expected = os.environ["TAG"].removeprefix("v")
          versions = {
              "package.json": json.loads(Path("package.json").read_text())["version"],
              "frontend/package.json": json.loads(Path("frontend/package.json").read_text())["version"],
              "website/package.json": json.loads(Path("website/package.json").read_text())["version"],
              "src-tauri/tauri.conf.json": json.loads(Path("src-tauri/tauri.conf.json").read_text())["version"],
          }
          cargo = Path("src-tauri/Cargo.toml").read_text()
          versions["src-tauri/Cargo.toml"] = re.search(r'^version\s*=\s*"([^"]+)"', cargo, re.M).group(1)
          wrong = {path: value for path, value in versions.items() if value != expected}
          if wrong:
              print(f"Tag {expected} does not match: {wrong}", file=sys.stderr)
              sys.exit(1)
          print(versions)
          PY

  build-windows:
    name: Build Windows NSIS
    needs: [quality, security, validate-version]
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-build.txt
      - uses: ./.github/actions/setup-safe-chain
      - run: npm ci --ignore-scripts
      - run: npm ci --ignore-scripts --prefix frontend
      - name: Build installer
        run: npm run tauri:build
      - name: Smoke test installer contract
        shell: pwsh
        run: npm run desktop:smoke
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: openharness-windows-unsigned-${{ github.ref_name }}
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14

  # Authenticode is mandatory — GitHub attestations/SBOM/checksums do not replace it.
  sign-windows:
    name: Authenticode sign NSIS
    needs: build-windows
    runs-on: windows-2025
    timeout-minutes: 20
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: openharness-windows-unsigned-${{ github.ref_name }}
          path: release-assets
      - name: Require Azure Trusted Signing configuration
        shell: pwsh
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          AZURE_TRUSTED_SIGNING_ENDPOINT: ${{ vars.AZURE_TRUSTED_SIGNING_ENDPOINT }}
          AZURE_TRUSTED_SIGNING_ACCOUNT: ${{ vars.AZURE_TRUSTED_SIGNING_ACCOUNT }}
          AZURE_TRUSTED_SIGNING_PROFILE: ${{ vars.AZURE_TRUSTED_SIGNING_PROFILE }}
        run: |
          $required = @(
            'AZURE_CLIENT_ID',
            'AZURE_TENANT_ID',
            'AZURE_SUBSCRIPTION_ID',
            'AZURE_TRUSTED_SIGNING_ENDPOINT',
            'AZURE_TRUSTED_SIGNING_ACCOUNT',
            'AZURE_TRUSTED_SIGNING_PROFILE'
          )
          $missing = @($required | Where-Object { [string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($_)) })
          if ($missing.Count -gt 0) {
            throw "Release blocked: Authenticode/Azure Trusted Signing is required. Missing in environment 'release': $($missing -join ', '). Checksums, SBOM, and attestations do not substitute for a signed installer."
          }
      - uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5 # v2.3.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - uses: azure/trusted-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          endpoint: ${{ vars.AZURE_TRUSTED_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.AZURE_TRUSTED_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.AZURE_TRUSTED_SIGNING_PROFILE }}
          files-folder: ${{ github.workspace }}\release-assets
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
      - name: Verify Authenticode signature
        shell: pwsh
        run: |
          $files = Get-ChildItem release-assets\*.exe
          if ($files.Count -lt 1) { throw "No installer EXE found to verify" }
          foreach ($f in $files) {
            $sig = Get-AuthenticodeSignature -FilePath $f.FullName
            if ($sig.Status -ne 'Valid') {
              throw "Authenticode verification failed for $($f.Name): Status=$($sig.Status) StatusMessage=$($sig.StatusMessage)"
            }
            Write-Host "Signed OK: $($f.Name) ($($sig.SignerCertificate.Subject))"
          }
      - name: Create SHA256 checksums
        shell: pwsh
        run: |
          $files = Get-ChildItem release-assets\*.exe
          if ($files.Count -ne 1) { throw "Expected exactly one NSIS installer" }
          $hash = Get-FileHash $files[0] -Algorithm SHA256
          "$($hash.Hash.ToLower())  $($files[0].Name)" | Set-Content release-assets\SHA256SUMS.txt -Encoding ascii
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: openharness-windows-${{ github.ref_name }}
          path: |
            release-assets/*.exe
            release-assets/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

  attest-and-release:
    name: Attest and publish
    needs: sign-windows
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: openharness-windows-${{ github.ref_name }}
          path: release-assets
      - name: Reject unsigned publish path
        run: |
          set -euo pipefail
          test -f release-assets/SHA256SUMS.txt
          count=$(find release-assets -maxdepth 1 -type f -name '*.exe' | wc -l)
          test "${count}" -eq 1
      - uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          path: release-assets
          format: cyclonedx-json
          output-file: release-assets/OpenHarness-${{ github.ref_name }}.cdx.json
      - uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3.0.0
        with:
          subject-path: release-assets/*.exe
      - uses: actions/attest-sbom@4651f806c01d8637787e274ac3bdf724ef169f34 # v3.0.0
        with:
          subject-path: release-assets/*.exe
          sbom-path: release-assets/OpenHarness-${{ github.ref_name }}.cdx.json
      - name: Publish immutable GitHub Release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "${GITHUB_REF_NAME}" release-assets/* \
            --verify-tag --generate-notes --title "OpenHarness ${GITHUB_REF_NAME}"
