name: Quality

on:
  workflow_call:
  pull_request:
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # Queue runs have a unique gh-readonly-queue ref; never cancel them mid-flight.
  cancel-in-progress: ${{ github.event_name != 'merge_group' }}

env:
  NODE_VERSION: 22.20.0
  PYTHON_VERSION: "3.12"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  frontend:
    name: eslint typecheck test build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: ./.github/actions/setup-safe-chain
      - run: npm ci --ignore-scripts
      - name: Lint
        run: npm exec -- eslint . --max-warnings=0
      - run: npm run typecheck
      - run: npm test
      - name: Ruleset required checks match job names
        working-directory: .
        run: node --test scripts/required-checks.test.mjs
      - run: npm run build

  backend:
    name: pytest
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: ./.github/actions/setup-safe-chain
      - name: Install test dependencies
        run: python -m pip install -r requirements.txt -r requirements-test.txt
      - name: Test
        run: python -m pytest -q --junitxml=pytest-results.xml
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: backend-test-results
          path: backend/pytest-results.xml
          if-no-files-found: error
          retention-days: 7

  rust-tauri:
    name: cargo fmt clippy test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Linux build dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Stub sidecar binary for clippy/test
        # tauri.conf.json externalBin requires the target-triple file at build-script time.
        run: |
          set -euo pipefail
          mkdir -p binaries
          : > binaries/openharness-sidecar-x86_64-unknown-linux-gnu
          chmod +x binaries/openharness-sidecar-x86_64-unknown-linux-gnu
      - run: rustc --version && cargo --version
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo test --locked --all-features

  website:
    name: website build playwright
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: ./.github/actions/setup-safe-chain
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: npm run build:pages
      - run: npm run test:publication
      - name: Browser and CSP tests
        env:
          BROWSER_CHANNEL: chromium
        run: |
          set -euo pipefail
          npm start > website-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4174/index.html >/dev/null; then break; fi
            if [[ "$attempt" == 30 ]]; then cat website-server.log; exit 1; fi
            sleep 1
          done
          npm run test:i18n
          npm run test:security

  compose:
    name: compose config
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: docker compose config --quiet

  required:
    name: Quality / required
    if: always()
    needs: [frontend, backend, rust-tauri, website, compose]
    runs-on: ubuntu-latest
    steps:
      - name: Enforce required results
        uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # v1.3.0
        with:
          jobs: ${{ toJSON(needs) }}
