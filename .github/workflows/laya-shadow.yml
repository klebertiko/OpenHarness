name: Laya triage

on:
  issues:
    types: [opened, edited]

permissions:
  contents: read
  issues: read

concurrency:
  group: laya-shadow-${{ github.event.issue.number || github.run_id }}
  cancel-in-progress: true

jobs:
  classify:
    name: Advisory classification only
    if: vars.ENABLE_LAYA_SHADOW == 'true' && github.event_name == 'issues'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    env:
      HF_HUB_DISABLE_XET: "1"
      USE_TF: "0"
      LAYA_OUTPUT: laya-shadow-result.json
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - uses: ./.github/actions/setup-safe-chain
      - run: python -m pip install laya==0.3.5
      - name: Produce non-authoritative evidence
        run: python scripts/laya_issue_shadow.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: laya-shadow-issue-${{ github.event.issue.number }}
          path: laya-shadow-result.json
          if-no-files-found: error
          retention-days: 30
