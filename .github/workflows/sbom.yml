name: SBOM CycloneDX

on:
  push:
    branches: [main]
  schedule:
    - cron: "41 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    name: Generate and validate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
            website/package-lock.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - uses: ./.github/actions/setup-safe-chain
      - name: Install locked application dependencies
        run: |
          npm ci --ignore-scripts
          npm ci --ignore-scripts --prefix frontend
          npm ci --ignore-scripts --prefix website
          python -m pip install -r backend/requirements.txt
      - name: Install pinned CycloneDX generators
        run: |
          npm install --global @cyclonedx/cyclonedx-npm@6.0.1
          python -m pip install cyclonedx-bom==7.4.0
          cargo install cargo-cyclonedx --version 0.5.9 --locked
      - name: Generate component SBOMs
        run: |
          mkdir -p sbom
          cyclonedx-npm --output-file sbom/root-npm.cdx.json --output-format JSON package-lock.json
          cyclonedx-npm --output-file sbom/frontend.cdx.json --output-format JSON frontend/package-lock.json
          cyclonedx-npm --output-file sbom/website.cdx.json --output-format JSON website/package-lock.json
          cyclonedx-py requirements backend/requirements.txt --output-format JSON --output-file sbom/backend.cdx.json
          cargo cyclonedx --manifest-path src-tauri/Cargo.toml --format json --override-filename tauri
          mv src-tauri/tauri.cdx.json sbom/tauri.cdx.json
      - name: Validate CycloneDX JSON
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          files = sorted(Path("sbom").glob("*.cdx.json"))
          assert len(files) == 5, files
          for path in files:
              data = json.loads(path.read_text(encoding="utf-8"))
              assert data.get("bomFormat") == "CycloneDX", path
              assert data.get("specVersion"), path
              assert isinstance(data.get("components", []), list), path
              print(path, len(data.get("components", [])))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cyclonedx-sboms-${{ github.sha }}
          path: sbom/*.cdx.json
          if-no-files-found: error
          retention-days: 30
