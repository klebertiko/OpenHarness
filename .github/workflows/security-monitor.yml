name: Dependency audit

on:
  schedule:
    - cron: "13 3 * * 4"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: npm, pip and Cargo audit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: ./.github/actions/setup-safe-chain
      - name: Install pinned auditors
        run: |
          python -m pip install pip-audit==2.9.0
          cargo install cargo-audit --version 0.21.2 --locked
      - name: Run audits and preserve evidence
        run: |
          set +e
          mkdir -p audit-results
          npm audit --audit-level=high --json > audit-results/root-npm.json; root_rc=$?
          npm audit --prefix frontend --audit-level=high --json > audit-results/frontend-npm.json; frontend_rc=$?
          npm audit --prefix website --audit-level=high --json > audit-results/website-npm.json; website_rc=$?
          pip-audit -r backend/requirements.txt --format json --output audit-results/backend-pip.json; pip_rc=$?
          cargo audit --file src-tauri/Cargo.lock --json > audit-results/tauri-cargo.json; cargo_rc=$?
          printf '{"root_npm":%s,"frontend_npm":%s,"website_npm":%s,"pip":%s,"cargo":%s}\n' \
            "$root_rc" "$frontend_rc" "$website_rc" "$pip_rc" "$cargo_rc" > audit-results/status.json
          if (( root_rc || frontend_rc || website_rc || pip_rc || cargo_rc )); then exit 1; fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: dependency-audit-results
          path: audit-results/
          if-no-files-found: error
          retention-days: 30

  issue:
    name: Upsert audit issue
    needs: audit
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Create or update deterministic tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          bash .github/scripts/upsert-security-issue.sh \
            "[security][dependencies] Scheduled audit requires attention" \
            "dependency-monitor/high-or-critical" \
            "One or more npm, pip or Cargo audits failed. Review the retained machine-readable reports: ${RUN_URL}"
