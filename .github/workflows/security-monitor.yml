name: Dependency Security Monitor

on:
  schedule:
    - cron: "13 3 * * 4"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: npm, pip and Cargo audit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - uses: ./.github/actions/setup-safe-chain
      - name: Install pinned auditors
        run: |
          python -m pip install pip-audit==2.9.0
          cargo install cargo-audit --version 0.21.2 --locked
      - name: Run audits and preserve evidence
        run: |
          set +e
          mkdir -p audit-results
          npm audit --audit-level=high --json > audit-results/root-npm.json; root_rc=$?
          npm audit --prefix frontend --audit-level=high --json > audit-results/frontend-npm.json; frontend_rc=$?
          npm audit --prefix website --audit-level=high --json > audit-results/website-npm.json; website_rc=$?
          pip-audit -r backend/requirements.txt --format json --output audit-results/backend-pip.json; pip_rc=$?
          cargo audit --file src-tauri/Cargo.lock --json > audit-results/tauri-cargo.json; cargo_rc=$?
          printf '{"root_npm":%s,"frontend_npm":%s,"website_npm":%s,"pip":%s,"cargo":%s}\n' \
            "$root_rc" "$frontend_rc" "$website_rc" "$pip_rc" "$cargo_rc" > audit-results/status.json
          if (( root_rc || frontend_rc || website_rc || pip_rc || cargo_rc )); then exit 1; fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: dependency-audit-results
          path: audit-results/
          if-no-files-found: error
          retention-days: 30

  issue:
    name: Upsert audit issue
    needs: audit
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Create or update deterministic tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TITLE: "[security][dependencies] Scheduled audit requires attention"
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          gh label create security --color B60205 --description "Security finding or hardening work" --force
          body="One or more npm, pip or Cargo audits failed. Review the retained machine-readable reports: ${RUN_URL}\n\nFingerprint: dependency-monitor/high-or-critical"
          number="$(gh issue list --state open --search "${TITLE} in:title" --json number,title --jq ".[] | select(.title == \"${TITLE}\") | .number" | head -n1)"
          if [[ -n "$number" ]]; then gh issue comment "$number" --body "$body"; else gh issue create --title "$TITLE" --body "$body" --label security; fi
