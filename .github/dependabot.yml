version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    groups:
      root-npm:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /frontend
    schedule: { interval: weekly }
    groups:
      frontend-npm:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /website
    schedule: { interval: weekly }
    groups:
      website-npm:
        patterns: ["*"]
  - package-ecosystem: pip
    directory: /backend
    schedule: { interval: weekly }
    groups:
      backend-python:
        patterns: ["*"]
  - package-ecosystem: cargo
    directory: /src-tauri
    schedule: { interval: weekly }
    groups:
      tauri-rust:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups:
      github-actions:
        patterns: ["*"]
