<!doctype html><html data-theme="dark"><head><meta charset="utf-8"><title>DS harness</title>
<link rel="stylesheet" href="tokens.css"><link rel="stylesheet" href="bundle.css">
<style>body{margin:0;background:var(--sub-000);color:var(--ink-dim);font:400 12px/1.5 var(--font-ui)}.card{border-bottom:1px solid var(--line-soft)}.h{padding:6px 16px;font:400 10.5px var(--font-mono);color:var(--ink-mute)}</style></head><body>
<div id="app"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"></script>
<script src="bundle.js"></script>
<script>
var q=new URLSearchParams(location.search);document.documentElement.dataset.theme=q.get('theme')||'dark';
var names=['Cover','Button','Input','Badge','Panel','ListRow','Kbd','Nilo'];window.__errors=[];
window.addEventListener('error',function(e){window.__errors.push(e.message)});
names.forEach(function(n){var d=document.createElement('div');d.className='card';d.innerHTML='<div class="h">'+n+'</div><div id="m-'+n+'"></div>';document.getElementById('app').appendChild(d);
fetch(n+'/preview.html').then(r=>r.text()).then(function(t){var host=document.getElementById('m-'+n);
 var body=/<body>([\s\S]*)<\/body>/.exec(t)[1];var scripts=[];body=body.replace(/<script>([\s\S]*?)<\/script>/g,function(_,s){scripts.push(s);return''});
 var style=(/<style>([\s\S]*?)<\/style>/.exec(t)||[])[1]||'';var st=document.createElement('style');st.textContent=style.replace(/(^|})\s*svg\s*\{/g,'$1 #m-'+n+' svg{').replace(/(^|})\s*(html,)?body\s*\{/g,'$1 #m-'+n+'{');document.head.appendChild(st);
 host.innerHTML=body;scripts.forEach(function(s){try{(new Function(s.replace('document.getElementById(\'r\')','document.querySelector("#m-'+n+' #r")').replace(/document\.getElementById\('dots'\)/,'document.querySelector("#m-'+n+' #dots")').replace(/document\.getElementById\('r'\)/,'document.querySelector("#m-'+n+' #r")')))()}catch(e){window.__errors.push(n+': '+e.message)}})});});
</script></body></html>
